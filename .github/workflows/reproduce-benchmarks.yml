name: Reproduce Core Aura Benchmarks

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: "Timed repetitions per standalone benchmark"
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "3"
          - "5"
          - "10"
          - "20"

permissions:
  contents: read

jobs:
  core-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4

      - name: Reproduce controls and treatments
        run: |
          python3 benchmarks/reproduce.py --repeats "${{ inputs.repeats }}"

      - name: Show comparison summary
        run: |
          cat benchmark-results/COMPARISON.md

      - name: Preserve fresh receipts
        uses: actions/upload-artifact@v4
        with:
          name: fresh-benchmark-receipts
          path: benchmark-results/
