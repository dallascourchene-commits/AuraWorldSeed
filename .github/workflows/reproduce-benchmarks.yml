name: Reproduce Core Aura Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out public repository
        uses: actions/checkout@v4

      - name: Show carrier
        run: |
          uname -a
          g++ --version
          python3 --version

      - name: Compile standalone C++20 benchmarks
        run: |
          mkdir -p benchmark-results bin
          CXXFLAGS="-O3 -march=native -std=c++20"
          g++ $CXXFLAGS benchmarks/src/orphanim_24pow4_bench.cpp -o bin/orphanim24
          g++ $CXXFLAGS benchmarks/src/triad_quartet_lattice_bench.cpp -o bin/triadquartet
          g++ $CXXFLAGS benchmarks/src/triad_quartet_projection_unification_bench.cpp -o bin/projection
          g++ $CXXFLAGS benchmarks/src/hdc_dual_frontier_bench.cpp -o bin/hdc
          g++ $CXXFLAGS benchmarks/src/reification_frontier_microscope.cpp -o bin/reification

      - name: Orphanim 24^4 structural sweep
        run: |
          bin/orphanim24 | tee benchmark-results/orphanim_24pow4.json

      - name: Triad / quartet 1M schedule search
        run: |
          bin/triadquartet 1000000 20261006 | tee benchmark-results/triad_quartet_1m.json

      - name: 3x4 <-> 4x3 projection lattice
        run: |
          bin/projection | tee benchmark-results/projection_unification.json

      - name: HDC / VSA calibrated statistical policy
        run: |
          bin/hdc --statistical-orthogonality | tee benchmark-results/hdc_vsa.json

      - name: Reification exact-reopen smoke test
        run: |
          bin/reification README.md benchmarks/src/triad_quartet_lattice_bench.cpp | tee benchmark-results/reification.json

      - name: Verify core deterministic assertions
        run: |
          python3 - <<'PY'
          import json, pathlib

          def load(name):
              return json.loads(pathlib.Path("benchmark-results", name).read_text())

          o = load("orphanim_24pow4.json")
          assert o["status"] == "PASS_24POW4_ORPHANIM"
          assert o["logical_coordinates"] == 24**4
          assert o["rank_roundtrip_pass"] == 24**4
          assert o["mirror_involution_pass"] == 24**4
          assert o["semantic_invariant_pass"] == (24**4)*24

          tq = load("triad_quartet_1m.json")
          assert tq["search_iterations"] == 1_000_000
          assert tq["best"]["metrics"]["operational_position_unique"] is True
          assert tq["best"]["metrics"]["unique_pairs"] == 66
          assert tq["world_scale_test"]["all_structural_invariants"] is True

          p = load("projection_unification.json")
          assert p["transpose_reopen"]["trials"] == 1_000_000
          assert p["transpose_reopen"]["state_mismatches"] == 0
          assert p["transpose_reopen"]["root_mismatches"] == 0

          h = load("hdc_vsa.json")
          status = h.get("status") or h.get("disposition") or ""
          assert "PASS" in status, status

          r = load("reification.json")
          assert r["disposition"] == "PASS_EXACT_REOPEN_MICROSCOPE"
          assert all(x["exact_reopen"] for x in r["files"])

          print("PASS: all core deterministic assertions")
          PY

      - name: Explain browser-only benchmark
        run: |
          echo "24^3 browser benchmark:"
          echo "https://dallascourchene-commits.github.io/AuraWorldSeed/benchmarks/24cube.html"
          echo "It is intentionally kept browser-native rather than rewritten for this runner."

      - name: Preserve fresh receipts
        uses: actions/upload-artifact@v4
        with:
          name: fresh-benchmark-receipts
          path: benchmark-results/
