<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aura Cartridge · game</title><body style="margin:0;background:#02040a;color:#dbeafe;font-family:system-ui"><div id="s" style="padding:30px">Hydrating Aura cartridge…</div><script>async function boot(){const n=location.pathname.split('/').pop().replace('.html','');const b=await fetch(n+'.cartridge.gz.b64').then(r=>r.text());const u=Uint8Array.from(atob(b.trim()),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const txt=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(txt);document.close()}boot().catch(e=>document.getElementById('s').textContent='HOLD_CARTRIDGE_HYDRATION: '+e)</script>
